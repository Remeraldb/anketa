<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="form-container">
        <h2>Анкета</h2>
        <div class="avatar-container">
            <img id="avatar" class="avatar" src="" alt="Аватар" style="display: none;">
        </div>
        <input type="file" id="fileInput" accept="image/*">
        <input type="text" id="name" placeholder="Ім'я">
        <input type="email" id="email" placeholder="Email">
        <div class="terms-container">
            <input type="checkbox" id="terms">
            <label for="terms">Я погоджуюсь з <a href="#">умовами використання</a></label>
        </div>
        <button onclick="submitForm()">Надіслати</button>
    </div>
    
    <div id="popup" class="popup">
        <div class="popup-content">
            <span class="close" onclick="closePopup()">&times;</span>
            <div class="avatar-container">
            <img id="popup-avatar" class="avatar" src="" alt="Аватар" style="display: none;">
            </div>
            <p id="popup-message"></p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
